name: Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-root:
    name: Build awsctrl (root module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        run: go build -v -o awsctrl .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: awsctrl
          path: awsctrl

  build-standalone:
    name: Build ec2viewer (standalone module)
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Linux GUI build dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxfixes-dev libxrandr-dev libxinerama-dev libwayland-dev libvulkan-dev

      - name: Build
        working-directory: standalone
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.goos == 'linux' && '1' || '0' }}
        run: go build -v -o ec2viewer-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ec2viewer-${{ matrix.goos }}-${{ matrix.goarch }}
          path: standalone/ec2viewer-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  build-samples:
    name: Build sample modules
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [ sample-s3-list, sample-s3-upload ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build -v ./...
